name: Waypoint CI/CD Pipeline 🛰️🛡️

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CODE QUALITY & STATIC ANALYSIS
  # ==========================================
  code-quality:
    name: 🔍 Lint, Format & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🎨 Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔎 Run Flutter Static Analysis
        run: flutter analyze

  # ==========================================
  # 2. AUTOMATED UNIT & WIDGET TESTS
  # ==========================================
  unit-tests:
    name: 🧪 Automated Test Suite & Coverage
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🚀 Run All Flutter Tests with Coverage
        run: flutter test --coverage

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ==========================================
  # 3. ANDROID BUILD & ARTIFACT GENERATION
  # ==========================================
  build-android:
    name: 📱 Build Android APK & App Bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Android Debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || 'AIzaSyCiCdMockValidationKey2026' }}
        run: flutter build apk --debug

      - name: 🚀 Build Android Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || 'AIzaSyCiCdMockValidationKey2026' }}
        run: flutter build apk --release

      - name: 📦 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
